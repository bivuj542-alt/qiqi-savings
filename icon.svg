  <defs>
    <linearGradient
      id="bg"
      x1="70"
      y1="40"
      x2="450"
      y2="480"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#f2a4cf"/>
      <stop offset="0.5" stop-color="#9e7de7"/>
      <stop offset="1" stop-color="#32204f"/>
    </linearGradient>

    <linearGradient
      id="coin"
      x1="330"
      y1="360"
      x2="430"
      y2="450"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset="1" stop-color="#f0b95c"/>
    </linearGradient>

    <linearGradient
      id="catFace"
      x1="120"
      y1="150"
      x2="260"
      y2="320"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#fff1f5"/>
      <stop offset="1" stop-color="#f6b7cb"/>
    </linearGradient>

    <linearGradient
      id="dogFace"
      x1="245"
      y1="150"
      x2="395"
      y2="330"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#f7f1ec"/>
      <stop offset="1" stop-color="#d7b59e"/>
    </linearGradient>

    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="170%"
    >
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="18"
        flood-color="#201332"
        flood-opacity="0.34"
      />
    </filter>
  </defs>

