<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
>
  <defs>
    <linearGradient
      id="background"
      x1="70"
      y1="40"
      x2="450"
      y2="490"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#ef9dcc"/>
      <stop offset="0.5" stop-color="#9b78e6"/>
      <stop offset="1" stop-color="#332052"/>
    </linearGradient>

    <linearGradient
      id="face"
      x1="170"
      y1="150"
      x2="350"
      y2="370"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#ffe4e6"/>
      <stop offset="1" stop-color="#f4a4bd"/>
    </linearGradient>

    <linearGradient
      id="snout"
      x1="205"
      y1="270"
      x2="310"
      y2="350"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#f7b2c6"/>
      <stop offset="1" stop-color="#de789d"/>
    </linearGradient>

    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="170%"
    >
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="18"
        flood-color="#211332"
        flood-opacity="0.34"
      />
    </filter>
  </defs>

  <!-- 全铺背景，适配圆角和图标着色 -->
  <rect
    width="512"
    height="512"
    fill="url(#background)"
  />

  <!-- 淡淡的星轨 -->
  <circle
    cx="256"
    cy="294"
    r="205"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.11"
    stroke-width="2"
  />

  <circle
    cx="256"
    cy="294"
    r="166"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.08"
    stroke-width="18"
  />

  <circle
    cx="94"
    cy="104"
    r="7"
    fill="#ffffff"
    fill-opacity="0.72"
  />

  <circle
    cx="420"
    cy="128"
    r="5"
    fill="#ffffff"
    fill-opacity="0.58"
  />

  <circle
    cx="78"
    cy="360"
    r="4"
    fill="#ffffff"
    fill-opacity="0.46"
  />

  <!-- 小猪 -->
  <g filter="url(#shadow)">
    <!-- 耳朵 -->
    <path
      d="M174 190
         C137 158 139 112 151 93
         C184 99 211 121 220 154
         Z"
      fill="#f49eba"
    />

    <path
      d="M338 190
         C375 158 373 112 361 93
         C328 99 301 121 292 154
         Z"
      fill="#f49eba"
    />

    <path
      d="M170 165
         C155 143 157 122 160 113
         C178 120 190 133 196 151
         Z"
      fill="#d96e96"
      opacity="0.78"
    />

    <path
      d="M342 165
         C357 143 355 122 352 113
         C334 120 322 133 316 151
         Z"
      fill="#d96e96"
      opacity="0.78"
    />

    <!-- 脸 -->
    <ellipse
      cx="256"
      cy="248"
      rx="137"
      ry="132"
      fill="url(#face)"
    />

    <!-- 额头高光 -->
    <ellipse
      cx="218"
      cy="177"
      rx="50"
      ry="30"
      fill="#ffffff"
      fill-opacity="0.22"
      transform="rotate(-18 218 177)"
    />

    <!-- 眼睛 -->
    <ellipse
      cx="205"
      cy="236"
      rx="18"
      ry="24"
      fill="#47334d"
    />

    <ellipse
      cx="307"
      cy="236"
      rx="18"
      ry="24"
      fill="#47334d"
    />

    <circle
      cx="199"
      cy="228"
      r="6"
      fill="#ffffff"
    />

    <circle
      cx="301"
      cy="228"
      r="6"
      fill="#ffffff"
    />

    <!-- 腮红 -->
    <ellipse
      cx="165"
      cy="280"
      rx="24"
      ry="14"
      fill="#ec79a2"
      opacity="0.44"
    />

    <ellipse
      cx="347"
      cy="280"
      rx="24"
      ry="14"
      fill="#ec79a2"
      opacity="0.44"
    />

    <!-- 鼻子 -->
    <ellipse
      cx="256"
      cy="303"
      rx="72"
      ry="52"
      fill="url(#snout)"
    />

    <ellipse
      cx="230"
      cy="303"
      rx="10"
      ry="15"
      fill="#75425c"
    />

    <ellipse
      cx="282"
      cy="303"
      rx="10"
      ry="15"
      fill="#75425c"
    />

    <!-- 微笑 -->
    <path
      d="M231 337
         C246 349 266 349 281 337"
      fill="none"
      stroke="#81465f"
      stroke-width="7"
      stroke-linecap="round"
    />
  </g>

  <!-- 金币 -->
  <g filter="url(#shadow)">
    <circle
      cx="398"
      cy="397"
      r="60"
      fill="#ffd986"
    />

    <circle
      cx="398"
      cy="397"
      r="45"
      fill="none"
      stroke="#e9ae4f"
      stroke-width="7"
    />

    <path
      d="M398 372
         C388 354 358 361 365 383
         C370 398 398 416 398 416
         C398 416 426 398 431 383
         C438 361 408 354 398 372Z"
      fill="#e88db5"
    />
  </g>
</svg>
